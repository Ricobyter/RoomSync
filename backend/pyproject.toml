[project]
name = "roomsync-backend"
version = "0.0.0"
description = "RoomSync Django backend"
requires-python = ">=3.12,<3.14"
dependencies = [
  "Django>=5.2,<5.3",
  "djangorestframework>=3.16,<3.19",
  "drf-spectacular>=0.28,<0.31",
  "django-cors-headers>=4.7,<5",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.0,<2",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-django>=4.9,<5",
  "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["."]
testpaths = ["apps", "tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "C4", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106", "S107"]
"tests/**" = ["S105", "S106", "S107"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "common", "config"]

[tool.ruff.format]
quote-style = "double"
